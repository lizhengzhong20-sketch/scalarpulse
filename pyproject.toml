[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scalarpulse"
dynamic = ["version"]
description = "A tiny, dependency-free live dashboard for model-training metrics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lizhengzhong" }]
keywords = ["machine-learning", "pytorch", "training", "metrics", "visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8"]

[project.scripts]
scalarpulse = "scalarpulse.cli:main"

[project.urls]
Homepage = "https://github.com/lizhengzhong20-sketch/scalarpulse"
Repository = "https://github.com/lizhengzhong20-sketch/scalarpulse.git"
Issues = "https://github.com/lizhengzhong20-sketch/scalarpulse/issues"
Changelog = "https://github.com/lizhengzhong20-sketch/scalarpulse/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scalarpulse = ["static/*.html"]

[tool.setuptools.dynamic]
version = { attr = "scalarpulse.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
