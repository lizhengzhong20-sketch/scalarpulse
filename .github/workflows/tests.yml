name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  package-smoke:
    name: Build and verify wheel
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/scalarpulse-smoke"
          "$RUNNER_TEMP/scalarpulse-smoke/bin/python" -m pip install --no-deps dist/*.whl

      - name: Smoke-test installed package and CLI
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/scalarpulse-smoke/bin/python" -c "import importlib.metadata; import scalarpulse; print(importlib.metadata.version('scalarpulse'))"
          "$RUNNER_TEMP/scalarpulse-smoke/bin/python" -m scalarpulse --version
          "$RUNNER_TEMP/scalarpulse-smoke/bin/scalarpulse" --version
          "$RUNNER_TEMP/scalarpulse-smoke/bin/scalarpulse" --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: scalarpulse-distributions
          path: dist/*
          if-no-files-found: error
