name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node for dashboard tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build tools
        run: python -m pip install -e ".[dev]"

      - name: Test Python and dashboard
        run: |
          python -m pytest -q
          node --test tests/dashboard.test.cjs

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Verify wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/scalarpulse-release-smoke"
          "$RUNNER_TEMP/scalarpulse-release-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/scalarpulse-release-smoke/bin/python" -m scalarpulse --version
          "$RUNNER_TEMP/scalarpulse-release-smoke/bin/scalarpulse" --help
          "$RUNNER_TEMP/scalarpulse-release-smoke/bin/python" "$GITHUB_WORKSPACE/tests/package_smoke.py"

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scalarpulse
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
